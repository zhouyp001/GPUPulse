name: build

on:
  push:
    branches: [ main ]
    paths:
      - '**/*.java'
      - '**/*.xml'
#      - '**/*.yml' #yml不做java编译，避免yml修改触发build
  pull_request:
    branches: [ main ]
    paths:
      - '**/*.java'
      - '**/*.xml'
#      - '**/*.yml' #yml不做java编译，避免yml修改触发build

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 8

      - name: Build with Maven
        run: mvn -B -DskipTests package
      - name: Run tests
        run: mvn -B test
