name: release

# 手动触发，最可控：在 Actions 页面点「Run workflow」，
# 填版本号 + 勾选是否草稿，确认无误后再正式发布。
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release 版本号，如 0.2.0'
        required: true
        default: '0.2.0'
      draft:
        description: '先创建为草稿（审阅后再手动发布）'
        type: boolean
        default: true

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write            # 允许创建 Release / 上传资产
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 8

      - name: Build & package dist
        run: |
          scripts/package.sh
          tar -czf dist/agent.tar.gz -C dist agent
          tar -czf dist/server.tar.gz -C dist server

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ inputs.version }}
          name: v${{ inputs.version }}
          draft: ${{ inputs.draft }}
          generate_release_notes: true
          files: |
            dist/agent.tar.gz
            dist/server.tar.gz
