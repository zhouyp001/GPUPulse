# Agent 配置。所有键均可用 -Dkey=value 覆盖（优先级高于本文件）。

# 本 Agent 代表哪台服务器（面板按此标识展示）
agent.server.id=server1

# 中央服务器地址
agent.server.host=127.0.0.1
agent.server.port=8080

# 采集与上报周期（毫秒）
agent.interval.ms=2000

# true=使用模拟 GPU 数据（开发机无 nvidia-smi / 演示用）；false=调用真实 nvidia-smi
agent.simulate=false

# 每次上报请求超时（毫秒）
agent.request.timeout.ms=3000

# 断线重试的指数退避策略（网络/服务端中断时的重试节奏）
# 首次失败后等待的毫秒数
agent.retry.initial.ms=1000
# 退避等待上限（毫秒），避免对不可达服务端持续高频轰炸
agent.retry.max.ms=30000
# 指数退避倍率（每次失败翻倍）
agent.retry.multiplier=2.0
