<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>服务器监控面板</title>
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <header class="topbar">
    <div class="brand"><span class="logo">◉</span> 服务器监控</div>
    <div class="topbar-right">
      <button id="clear-offline" class="vt-btn" type="button" title="清空离线/未连接的历史记录">清除离线</button>
      <div class="view-toggle">
        <button id="view-full" class="vt-btn active" type="button">标准</button>
        <button id="view-compact" class="vt-btn" type="button">精简</button>
        <button id="view-table" class="vt-btn" type="button">表格</button>
        <button id="view-bar" class="vt-btn" type="button">条形</button>
      </div>
      <span id="conn" class="chip">连接中…</span>
    </div>
  </header>
  <div id="bar-controls" class="bar-controls" hidden>
    <span class="bar-controls-label">显示指标：</span>
    <label><input type="checkbox" data-metric="util" checked>利用率</label>
    <label><input type="checkbox" data-metric="temp" checked>温度</label>
    <label><input type="checkbox" data-metric="mem" checked>显存</label>
    <label><input type="checkbox" data-metric="power" checked>功耗</label>
  </div>
  <main id="servers" class="servers"></main>
  <div id="table-view" class="table-view" hidden></div>
  <p id="empty" class="empty" hidden>等待数据接入…</p>
  <script src="js/app.js"></script>
</body>
</html>
