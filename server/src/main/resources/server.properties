# 中央服务器配置。所有键均可用 -Dkey=value 覆盖（优先级高于本文件）。

# 监听端口（同时承载：Agent 上报 HTTP / 面板 WebSocket / 静态前端 / MCP 端点）
server.port=8080

# 面板静态文件目录（相对启动时的工作目录；也尝试从上级目录解析，便于不同运行位置）
server.web.dir=web

# 超过该时长（毫秒）未收到上报即判定该服务器离线
server.offline.ms=10000

# 离线扫描与状态同步周期（毫秒）
server.sync.interval.ms=3000

# MCP 端点开关：false 时整个 MCP 面不加载（默认 true）
server.mcp.enabled=true

# MCP 端点路径
server.mcp.path=/mcp

# MCP 可选共享 token：非空时要求请求携带 Authorization: Bearer <token>；留空=开放
server.mcp.token=
